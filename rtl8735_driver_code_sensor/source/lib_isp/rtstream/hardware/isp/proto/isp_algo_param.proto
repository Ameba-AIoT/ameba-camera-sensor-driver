syntax = "proto3";

/* #define ISP_ALGO_PARAM_MAGIC_NUM 0x414C474F */
/* #define ISP_ALGO_PARAM_VERSION 0x00010006 */

message isp_algo_param_header_t {
  uint32 magic = 1;
  uint32 version = 2;
}

message isp_algo_param_ae_t {
  uint32 y_mean = 1;
  repeated float gain = 2;
  repeated float exposure = 3;
  repeated float over_ratio = 4;
  repeated uint32 hist_mean = 5;
  repeated uint32 is_stable = 6;
  float saturated_ratio = 7;
  oneof ae_ctrl_force_writable {
    bool ae_ctrl_force = 8;
  }
  // uint32 dark_sort_index = 9;
  // uint32 bright_sort_index = 10;
  uint32 sort_gain_index = 9;
  uint32 ratio_range_index = 10;
  uint32 cur_fast_ae_count = 11;
  uint32 cur_y_target = 12;
  float cur_dyn_fps = 13;
  uint32 cur_drc_region = 14;
}

message isp_algo_point_t {
  uint32 x = 1;
  uint32 y = 2;
}

message isp_algo_param_awb_t {
  isp_algo_point_t gray_gain = 1;
  isp_algo_point_t green_gain = 2;
  isp_algo_point_t rough_gain = 3;
  isp_algo_point_t result_gain = 4;
  uint32 color_temperature = 5;
  oneof awb_ctrl_force_writable {
    bool awb_ctrl_force = 6;
  }
  uint32 adj_ct_index = 7;
  uint32 adj_gain_index = 8;
  uint32 white_num = 9;
  uint32 rg_sum = 10;
  uint32 bg_sum = 11;
}

message isp_algo_param_flick_t {
  uint32 insert_dummy_line = 1;
  uint32 cur_freq = 2;
}

message isp_algo_param_wdr_t {
  uint32 day_night = 1;
  uint32 low_bound = 2;
  uint32 wdr_level = 3;
  uint32 hist_contrast_origin = 4;
  uint32 hist_contrast = 5;
}

message isp_algo_param_blc_t {
  uint32 ct_index = 1;
  uint32 gain_index = 2;
  uint32 ht_index = 3;
}

message isp_algo_param_nlsc_t {
  uint32 ct_index = 1;
  uint32 gain_index = 2;
}

message isp_algo_param_ccm_t {
  uint32 ct_index = 1;
  uint32 gain_index = 2;
  uint32 ht_index = 3;
}

message isp_algo_param_gamma_t {
  uint32 ratio_index = 1;
  uint32 gain_index = 2;
  uint32 ht_index = 3;
}

message isp_algo_param_ygc_t {
  uint32 ratio_index = 1;
  uint32 gain_index = 2;
  uint32 ht_index = 3;
}

message isp_algo_param_uvtune_t {
  uint32 ct_index = 1;
  uint32 gain_index = 2;
}

message isp_algo_param_spe_t {
  uint32 ct_index = 1;
}

message isp_algo_param_texture_t {
  uint32 ratio_index = 1;
  uint32 gain_index = 2;
}

message isp_algo_param_high_temp_t {
  bool high_temp_en = 1;
}

message isp_algo_param_tm_t {
  uint32 gain_index = 2;
  uint32 ht_index = 3;
}

message isp_algo_param_snr_t {
  uint32 gain_index = 2;
}

message isp_algo_param_md_t {
  uint32 md_val = 1;
  uint32 gain_index = 2;
}

message isp_algo_param_t {
  isp_algo_param_header_t header = 1;
  isp_algo_param_ae_t ae = 2;
  isp_algo_param_awb_t awb = 3;
  isp_algo_param_flick_t flick = 4;
  isp_algo_param_wdr_t wdr = 5;
  isp_algo_param_blc_t blc = 6;
  isp_algo_param_nlsc_t nlsc = 7;
  isp_algo_param_ccm_t ccm = 8;
  isp_algo_param_gamma_t gamma = 9;
  isp_algo_param_ygc_t ygc = 10;
  isp_algo_param_uvtune_t uvtune = 11;
  isp_algo_param_spe_t spe = 12;
  isp_algo_param_texture_t texture = 13;
  isp_algo_param_high_temp_t high_temp = 14;
  isp_algo_param_tm_t tm = 15;
  isp_algo_param_snr_t snr = 16;
  isp_algo_param_md_t md = 17;
}
