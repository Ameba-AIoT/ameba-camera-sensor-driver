message isp_iq_gamma_t {
  isp_iq_gamma_dyn_ratio_t dyn_ratio = 2;
  isp_iq_gamma_dyn_gain_t dyn_gain = 5;
  isp_iq_gamma_dyn_ht_t dyn_ht = 4;
}

