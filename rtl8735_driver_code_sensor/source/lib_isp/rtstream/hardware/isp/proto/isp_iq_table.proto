  isp_iq_bounds_t bounds = 2;
  repeated isp_iq_ccm_item_t items = 3;
  bool based_on_gain = 4; /* false for temperature, true for gain */
}

message isp_iq_ccm_t {
  isp_iq_ccm_dyn_gain_t dyn_gain = 2;
  isp_iq_ccm_dyn_ct_t dyn_ct = 3;
  isp_iq_ccm_dyn_ht_t dyn_ht = 4;
}

message isp_iq_gamma_item_t {
