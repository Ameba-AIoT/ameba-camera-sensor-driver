message isp_iq_texture_static_t {
  repeated uint32 offsets = 1;
  repeated sint32 values = 2;
}

message isp_iq_level_t {
  float multiple = 1;
  sint32 min_val = 2;
  sint32 max_val = 3;
}

/* offset contains: [31:27]: bit_offset, [26:22]: bits, [21:0]: reg_offset */
message isp_iq_texture_dynamic_offset_t {
  repeated uint32 discrete_offsets = 1;
  repeated uint32 continuous_offsets = 2;

  repeated uint32 nr_discrete_offsets = 3;
  repeated isp_iq_level_t nr_discrete_levels = 4;
  repeated uint32 nr_continuous_offsets = 5;
  repeated isp_iq_level_t nr_continuous_levels = 6;

  repeated uint32 de_discrete_offsets = 7;
  repeated isp_iq_level_t de_discrete_levels = 8;
  repeated uint32 de_continuous_offsets = 9;
  repeated isp_iq_level_t de_continuous_levels = 10;

  repeated uint32 md_discrete_offsets = 11;
  repeated isp_iq_level_t md_discrete_levels = 12;
  repeated uint32 md_continuous_offsets = 13;
  repeated isp_iq_level_t md_continuous_levels = 14;
}

message isp_iq_texture_dynamic_value_t {
  repeated sint32 discrete_values = 1;
  repeated sint32 continuous_values = 2;

  repeated sint32 nr_discrete_values = 3;
  repeated sint32 nr_continuous_values = 4;

  repeated sint32 de_discrete_values = 5;
  repeated sint32 de_continuous_values = 6;

  repeated sint32 md_discrete_values = 7;
  repeated sint32 md_continuous_values = 8;
  repeated bool   md_ind_discrete_enable = 9;
  repeated bool   md_ind_continuous_enable = 10;
}

message isp_iq_texture_dynamic_t {
  bool enable = 1;
  isp_iq_bounds_t bounds = 2;
  isp_iq_texture_dynamic_offset_t offset = 3;
  repeated isp_iq_texture_dynamic_value_t values = 4;
  bool based_on_et_gain = 5; /* false for gain, true for et_gain */
}

message isp_iq_texture_dyn_ratio_gain_t {
  bool enable = 1;
}

message isp_iq_texture_dyn_ratio_item_t {
  repeated isp_iq_texture_dynamic_value_t gain_items = 2;
  bool based_on_et_gain = 3; /* false for gain, true for et_gain */
}

message isp_iq_texture_dyn_ratio_t {
  bool enable = 1;
  isp_iq_bounds_t bounds = 2;
  isp_iq_bounds_t dyn_gain_bounds = 3;
  isp_iq_texture_dynamic_offset_t offset = 4;
  repeated isp_iq_texture_dyn_ratio_item_t ratio_items = 5;
}

message isp_iq_texture_t {
  isp_iq_texture_static_t static_regs = 1;
  isp_iq_texture_dynamic_t dynamic_regs = 3;
  isp_iq_texture_dyn_ratio_t dyn_ratio_regs = 4;
  isp_iq_texture_dyn_ratio_gain_t dyn_ratio_gain = 5;
}

message isp_iq_daynight_t {
  float exit_ir_block_th = 1;
  uint32 exit_rgb_etgain_th = 2;
  uint32 exit_ir_etgain_th = 3;
  uint32 exit_ir_gain_th = 4;
  uint32 ir2rgb_time = 5;
  uint32 rgb2ir_time = 6;
  repeated uint32 exit_ir_detect_table = 7;
}

message isp_iq_high_temp_t {
  bool enable = 1;
  uint32 interval = 2; /* ms */
  isp_iq_bound_t gain = 3;
  isp_iq_bound_t temp = 4;
}

message isp_iq_md_decay_ratio_t {
  float luma = 1;
  float color = 2;
}

message isp_iq_md_item_t {
  isp_iq_bounds_t bounds = 1;
  repeated uint32 ratio = 2;
}

message isp_iq_md_dyn_gain_t {
  bool enable = 1;
  isp_iq_bounds_t bounds = 2;
  repeated isp_iq_md_item_t gain_items = 3;
  bool based_on_et_gain = 4; /* false for gain, true for et_gain */
}

message isp_iq_md_t {
  bool ae_en = 1;
  bool awb_en = 2;
  repeated uint32 noise_thd = 3;
  isp_iq_md_decay_ratio_t decay_ratio = 4;
  isp_iq_md_dyn_gain_t dyn_gain = 5;
}

message isp_iq_table_t {
  isp_iq_header_t header = 1;
  isp_iq_blc_t blc = 2;
  isp_iq_nlsc_t nlsc = 3;
  isp_iq_mlsc_t mlsc = 4;
  isp_iq_ae_t ae = 5;
  isp_iq_awb_t awb = 6;
  isp_iq_af_t af = 7;
  isp_iq_ccm_t ccm = 8;
  isp_iq_gamma_t gamma = 9;
  isp_iq_wdr_t wdr = 10;
  isp_iq_ygc_t ygc = 11;
  isp_iq_uvtune_t uvtune = 12;
  isp_iq_spe_t spe = 13;
  isp_iq_texture_t texture = 14;
  isp_iq_daynight_t daynight = 15;
  isp_iq_high_temp_t high_temp = 16;
  isp_iq_tm_t tm = 17;
  isp_iq_snr_t snr = 18;
  isp_iq_md_t md = 19;
}
