}

message isp_iq_gamma_ratio_item_t {
  isp_iq_bounds_t bounds = 1;
  repeated isp_iq_gamma_item_t gain_items = 2;
  bool based_on_et_gain = 3; /* false for gain, true for et_gain */
}

message isp_iq_gamma_dyn_ratio_t {
  bool enable = 1;
  isp_iq_bounds_t bounds = 2;
  repeated isp_iq_gamma_ratio_item_t ratio_items = 3;
}

message isp_iq_gamma_dyn_ht_t {
