syntax = "proto3";

/* #define ISP_IQ_MAGIC_NUM 0x49515442 */
/* #define ISP_IQ_VERSION 0x0001000C */

/* ct means color temperature */
/* ht means high temperature */

message isp_iq_header_t {
  uint32 magic = 1;
  uint32 version = 2;
}

message isp_iq_bound_t {
  sint32 enter_th = 1;
  sint32 exit_th = 2;
}

message isp_iq_bounds_t {
  uint32 def_index = 1;
  repeated sint32 bounds = 2;
}

message isp_iq_hysteresis_bounds_t {
  uint32 def_index = 1;
  repeated isp_iq_bound_t bounds = 2;
}

message isp_iq_point_t {
  sint32 x = 1;
  sint32 y = 2;
}

message isp_iq_blc_dyn_gain_t {
  bool enable = 1;
}

message isp_iq_blc_offset_t {
  repeated uint32 r = 1;
  repeated uint32 gr = 2;
  repeated uint32 gb = 3;
  repeated uint32 b = 4;
}

message isp_iq_blc_ct_item_t {
  isp_iq_bounds_t bounds = 1;
  repeated isp_iq_blc_offset_t offsets = 2;
  bool based_on_et_gain = 3; /* false for gain, true for et_gain */
}

message isp_iq_blc_dyn_ct_t {
  bool enable = 1;
  isp_iq_hysteresis_bounds_t bounds = 2;
  repeated isp_iq_blc_ct_item_t ct_items = 3;
}

message isp_iq_blc_dyn_ht_t {
  bool enable = 1;
  isp_iq_bounds_t bounds = 2;
  repeated isp_iq_blc_offset_t offsets = 3;
  bool based_on_gain = 4; /* false for temperature, true for gain */
}

message isp_iq_blc_t {
  isp_iq_blc_dyn_gain_t dyn_gain = 2;
  isp_iq_blc_dyn_ct_t dyn_ct = 3;
  isp_iq_blc_dyn_ht_t dyn_ht = 4;
}

message isp_iq_nlsc_common_t {
  repeated uint32 r_curve = 1;
  repeated uint32 g_curve = 2;
  repeated uint32 b_curve = 3;
  isp_iq_point_t r_center = 4;
  isp_iq_point_t g_center = 5;
  isp_iq_point_t b_center = 6;
  uint32 step = 7;
}

message isp_iq_nlsc_dyn_gain_t {
  bool enable = 1;
}

message isp_iq_nlsc_adj_t {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
}

message isp_iq_nlsc_ct_item_t {
  isp_iq_bounds_t bounds = 1;
  repeated isp_iq_nlsc_adj_t adjs = 2;
  bool based_on_et_gain = 3; /* false for gain, true for et_gain */
}

message isp_iq_nlsc_dyn_ct_t {
  bool enable = 1;
  isp_iq_hysteresis_bounds_t bounds = 2;
  repeated isp_iq_nlsc_ct_item_t ct_items = 3;
  uint32 pixels_for_enable = 4; /* 0 to 1000 */
  uint32 pixels_for_disable = 5; /* 0 to 1000 */
}

message isp_iq_nlsc_t {
  isp_iq_nlsc_common_t common = 1;
  isp_iq_nlsc_dyn_gain_t dyn_gain = 2;
  isp_iq_nlsc_dyn_ct_t dyn_ct = 3;
}

message isp_iq_mlsc_t {
  uint32 mode = 1;
  repeated uint32 matrix_r = 2;
  repeated uint32 matrix_g = 3;
  repeated uint32 matrix_b = 4;
}

message isp_iq_ae1_dyn_sort_table_t {
  isp_iq_bounds_t bounds = 1;
  repeated uint32 tables = 2;
  bool based_on_et_gain = 3; /* false for gain, true for et_gain */
}

message isp_iq_ae1_dyn_target_t {
  bool enable = 1;
  uint32 src_th0 = 2;
  uint32 src_th1 = 3;
  uint32 src_th2 = 4;
  uint32 src_th3 = 5;
  uint32 extent1 = 6;
  uint32 extent2 = 7;
  uint32 extent3 = 8;
}

message isp_iq_range_t {
  sint32 min = 1;
  sint32 max = 2;
}

message isp_iq_ae1_dyn_ratio_range_t {
  bool enable = 1;
  bool based_on_et_gain = 2; /* false for gain, true for et_gain */
  isp_iq_bounds_t bounds = 3;
  repeated isp_iq_range_t ranges = 4;
}

message isp_iq_ae1_ratio_inc_ctrl_t {
  bool enable = 1;
  float gain_thd = 2;
}

message isp_iq_ae1_hdr_t {
  uint32 over_bin = 1;
  uint32 y_mean_hdr_adjust_offset = 2;
  sint32 hist_mean_target_offset = 3;
  uint32 hist_mean_th1 = 4;
  uint32 hist_mean_th2 = 5;
  uint32 hist_mean_th3 = 6;
  float inc_adj_step = 7;
  float dec_adj_step = 8;
  float ratio_adj_step = 9;
  float over_ratio_th1 = 10;
  float over_ratio_th2 = 11;
  float over_ratio_th3 = 12;
  float ae_fast_step_inc_etgain_th_pow = 13;
  float ae_fast_step_inc_etgain_th_lvl3 = 14;
  float ae_fast_step_inc_etgain_th_lvl2_dark = 15;
  float ae_fast_step_inc_etgain_th_lvl2 = 16;
  float ae_fast_step_inc_etgain_th_lvl1 = 17;
  float ae_fast_step_dec_etgain_th_lvl1 = 18;
  float ae_fast_step_dec_etgain_th_lvl1_bright = 19;
  float ae_fast_step_dec_etgain_th_lvl2 = 20;
  float ae_fast_step_dec_etgain_th_pow = 21;
  isp_iq_ae1_dyn_ratio_range_t dyn_ratio_range = 22;
  isp_iq_ae1_ratio_inc_ctrl_t ratio_inc_ctrl = 23;

}

message isp_iq_ae1_t {
  repeated uint32 win_weight = 1;
  uint32 y_mean_target = 2;
  uint32 same_block_en = 3;
  uint32 y_mean_same_block_diff_th = 4;
  uint32 same_block_num_stable_th = 5;
  uint32 same_block_num_delay_th = 6;
  uint32 y_mean_enter_high_light_th = 7;
  uint32 y_mean_exit_high_light_th = 8;
  uint32 ae_stable_delay = 9; /* ms */
  uint32 total_gain_max = 10; /* 1/16 */
  uint32 y_mean_delay_th_l = 11;
  uint32 y_mean_delay_th_h = 12;
  uint32 y_mean_same_block_th_l = 13;
  uint32 y_mean_same_block_th_h = 14;
  float ae_enter_stable_th = 15;
  float ae_exit_stable_th = 16;
  float ae_enter_slow_mode_th = 17;
  float ae_slow_mode_step_th_l = 18;
  float ae_slow_mode_step_th_h = 19;
  float ae_fast_step_inc_etgain_th_pow = 20;
  float ae_fast_step_inc_etgain_th_lvl3 = 21;
  float ae_fast_step_inc_etgain_th_lvl2 = 22;
  float ae_fast_step_inc_etgain_th_lvl1 = 23;
  float ae_fast_step_dec_etgain_th_lvl1 = 24;
  float ae_fast_step_dec_etgain_th_lvl2 = 25;
  float ae_fast_step_dec_etgain_th_pow = 26;
  uint32 dyn_fps_min = 27;
  repeated uint32 dyn_gain_th = 28;
  repeated uint32 dyn_fps = 29;
  uint32 sort_mode = 30;
  uint32 saturated_range_th1 = 31;
  uint32 saturated_range_th2 = 32;
  uint32 saturated_range_th3 = 33;
  uint32 sort_weight_ratio = 34;
  uint32 manual_level = 35;
  isp_iq_ae1_dyn_sort_table_t dark_table = 36;
  isp_iq_ae1_dyn_sort_table_t bright_table = 37;
  repeated uint32 sort_win_weight_low = 38;
  repeated uint32 sort_win_weight_high = 39;
  isp_iq_ae1_dyn_target_t dyn_target_etgain = 40; /* src is et_gain */
  isp_iq_ae1_dyn_target_t dyn_target_saturate = 41; /* src is saturated_ratio */
  uint32 y_mean_target_l = 42;
  uint32 y_mean_target_h = 43;
  float hist_contrast_power = 44;
  uint32 hist_pos_th_l = 45;
  uint32 hist_pos_th_h = 46;
  uint32 hist_percentage_th_l = 47;
  uint32 hist_percentage_th_h = 48;
  isp_iq_ae1_hdr_t hdr = 49;
  uint32 switch_start_ae_count = 50;
  uint32 ae_intp_delay_frame = 51;
  uint32 alpha_step_th_hl = 52;
  uint32 alpha_step_th_ll = 53;
}

message isp_iq_ae_t {
  bool enable = 1;
  float def_exposure = 2;
  float def_gain = 3;
  uint32 algo_delay = 4;
  oneof algo {
    isp_iq_ae1_t ae1 = 5;
  }
}

message isp_iq_awb1_weight_table_t {
  repeated uint32 w_table = 1;
  repeated uint32 g_table = 2;
}

message isp_iq_awb1_green_t {
  bool enable = 1;
  uint32 gray_thd = 2;
  uint32 enter_green_thd = 3;
  uint32 exit_green_thd = 4;
  isp_iq_point_t d50 = 5;
  isp_iq_point_t d65 = 6;
  uint32 x_min = 7;
  uint32 y_min = 8;
  uint32 x_max = 9;
  uint32 y_max = 10;
  uint32 b_delta = 11;
  float k_green_est = 12;
  float k_gray_est = 13;
  float d_min = 14;
  float d_def = 15;
  float d_max = 16;
  float b_max = 17;
  float b_def = 18;
  float b_min = 19;
}

message isp_iq_awb1_mixct_t {
  bool enable = 1;
  uint32 h_ct_index = 2;
  uint32 l_ct_index = 3;
  uint32 enter_num_th = 4;
  float enter_th_l = 5;
  float enter_th_h = 6;
  float exit_th_l = 7;
  float exit_th_h = 8;
  float enter_h_ct_th = 9;
  float exit_h_ct_th = 10;
  float exit_l_ct_th = 11;
  isp_iq_awb1_weight_table_t h_ct_weight = 12;
  isp_iq_awb1_weight_table_t l_ct_weight = 13;
}

message isp_iq_awb1_rough_limit_t {
  uint32 y_min = 2;
  uint32 y_max = 3;
  uint32 r_min = 4;
  uint32 r_max = 5;
  uint32 g_min = 6;
  uint32 g_max = 7;
  uint32 b_min = 8;
  uint32 b_max = 9;
  uint32 rg_min = 10;
  uint32 rg_max = 11;
  uint32 bg_min = 12;
  uint32 bg_max = 13;
}

message isp_iq_awb1_fine_limit_t {
  uint32 y_min = 2;
  uint32 y_max = 3;
  uint32 rg_min = 4;
  uint32 rg_max = 5;
  uint32 bg_min = 6;
  uint32 bg_max = 7;
}

message isp_iq_awb1_illums_t {
  repeated uint32 r_gain = 2;
  repeated uint32 b_gain = 3;
  uint32 rg_min = 4;
  uint32 rg_max = 5;
  uint32 bg_min = 6;
  uint32 bg_max = 7;
  uint32 y_min = 8;
  uint32 y_max = 9;
}

message isp_iq_awb1_stat_config_t {
  isp_iq_awb1_rough_limit_t rough = 1;
  isp_iq_awb1_fine_limit_t fine = 2;
  isp_iq_awb1_illums_t illums = 3;
}

message isp_iq_awb1_t {
  uint32 ct_num = 1;
  uint32 ct_block_num = 2;
  repeated isp_iq_point_t ct = 3;
  repeated uint32 illum_ct = 4;
  float a = 5;
  float b = 6;
  float c = 7;
  repeated isp_iq_point_t white_area_up = 8;
  repeated isp_iq_point_t white_area_down = 9;
  repeated isp_iq_point_t gray_area_up = 10;
  repeated isp_iq_point_t gray_area_down = 11;
  isp_iq_awb1_weight_table_t normal_weight = 12;
  uint32 fine_gain_th = 13;
  uint32 final_gain_diff_th = 14;
  uint32 white_pixels_ratio = 15;
  uint32 awb_stable_delay = 16;
  uint32 rg_bg_num_th = 17;
  isp_iq_awb1_green_t green = 18;
  isp_iq_awb1_mixct_t mixct = 19;
  isp_iq_awb1_stat_config_t config = 20;
  uint32 min_bright_th = 21;
  uint32 switch_start_awb_count = 22;
  uint32 awb_intp_delay_frame = 23;
}

message isp_iq_awb_gain_adj_t {
  uint32 r_gain = 1;
  uint32 b_gain = 2;
}

message isp_iq_awb_ct_item_t {
  isp_iq_bounds_t bounds = 1;
  repeated isp_iq_awb_gain_adj_t adjs = 2;
  bool based_on_et_gain = 3; /* false for gain, true for et_gain */
}

message isp_iq_awb_dyn_ct_t {
  bool enable = 1;
  isp_iq_hysteresis_bounds_t bounds = 2;
  repeated isp_iq_awb_ct_item_t ct_items = 3;
}

message isp_iq_awb_dyn_gain_t {
  bool enable = 1;
}

message isp_iq_awb_t {
  bool enable = 1;
  uint32 def_r_gain = 2;
  uint32 def_g_gain = 3;
  uint32 def_b_gain = 4;
  uint32 algo_delay = 5;
  oneof algo {
    isp_iq_awb1_t awb1 = 6;
  }
  isp_iq_awb_dyn_gain_t dyn_gain = 7;
  isp_iq_awb_dyn_ct_t dyn_ct = 8;
}

message isp_iq_af1_block_t {
  bool enable = 1;
  uint32 low_bound = 2;
  uint32 up_bound = 3;
  uint32 sharpness_th = 4;
