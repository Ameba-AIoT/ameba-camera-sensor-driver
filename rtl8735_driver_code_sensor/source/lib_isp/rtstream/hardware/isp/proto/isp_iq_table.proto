message isp_iq_af1_t {
  uint32 af_statis_th = 1;
  uint32 fine_step = 2;
  float fine_high_peak_ratio = 3;
  float fine_low_peak_ratio = 4;
  float fine_sharpness_ratio = 5;
  uint32 fine_decrease_cnt = 6;
  uint32 rough_step = 7;
  float rough_high_peak_ratio = 8;
  float rough_low_peak_ratio = 9;
  float rough_sharpness_ratio = 10;
  uint32 rough_decrease_cnt = 11;
  uint32 sharpness_peak_th = 12;
  float sharpness_diff_ratio = 13;
  uint32 diff_cnt = 14;
  uint32 ng_pos = 15;
  uint32 search_mode_th = 16;
  repeated uint32 pos = 17;
  uint32 color_diff_th = 18;
  uint32 color_diff_cnt_th = 19;
  isp_iq_af1_block_t block = 20;
}

message isp_iq_af_t {
  bool enable = 1;
  uint32 def_position = 2;
  oneof algo {
    isp_iq_af1_t af1 = 3;
  }
}

message isp_iq_ccm_item_t {
  repeated sint32 ccm = 1;
}

message isp_iq_ccm_ct_item_t {
  isp_iq_bounds_t bounds = 1;
  repeated isp_iq_ccm_item_t gain_items = 2;
